<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 512 512"
     width="512"
     height="512"
     role="img"
     aria-labelledby="title desc">
  <title id="title">CA — Crítica Acelerada</title>
  <desc id="desc">Minimalist CA monogram with a diagonal slash inside a circular ring.</desc>

  <rect width="512" height="512" fill="#000000"/>

  <!-- Outer identity ring -->
  <circle cx="256" cy="256" r="224"
          fill="none"
          stroke="#F90A5B"
          stroke-width="5"/>

  <!-- C -->
  <path d="M 258 175
           A 82 82 0 1 0 258 337"
        fill="none"
        stroke="#F90A5B"
        stroke-width="27"
        stroke-linecap="butt"/>

  <!-- A -->
  <path d="M 260 340 L 332 190 L 408 340"
        fill="none"
        stroke="#F90A5B"
        stroke-width="27"
        stroke-linecap="butt"
        stroke-linejoin="miter"/>

  <!-- Diagonal slash -->
  <path d="M 120 385 L 388 127"
        fill="none"
        stroke="#F90A5B"
        stroke-width="4"
        stroke-linecap="butt"/>
</svg>
